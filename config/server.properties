# Конфігурація брокера Kafka 3.7.1 (крок 2.3)

# Унікальний ID брокера
broker.id=0
# Порт для підключення клієнтів (локальний хост для тестування)
listeners=PLAINTEXT://localhost:9092
# Директорія для зберігання повідомлень (відносно папки kafka)
log.dirs=../kafka-logs

# Мережеві та I/O потоки, розміри буферів, максимальний запит 100MB
num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

# Топіки: 3 партиції за замовчуванням, 1 репліка (один брокер), автостворення
num.partitions=3
default.replication.factor=1
auto.create.topics.enable=true

# Зберігання повідомлень 7 днів, сегменти по 1GB, видалення старих логів
log.retention.hours=168
log.segment.bytes=1073741824
log.cleaner.enable=true
log.cleanup.policy=delete

# Компресію визначає продюсер; мітка часу повідомлення = час створення
compression.type=producer
log.message.timestamp.type=CreateTime

# Підключення до ZooKeeper
zookeeper.connect=localhost:2181
zookeeper.connection.timeout.ms=18000

# Службові топіки та запис для кластера з одного брокера
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
min.insync.replicas=1

# Без затримки першого ребалансу групи консюмерів (з оригінального server.properties)
group.initial.rebalance.delay.ms=0
