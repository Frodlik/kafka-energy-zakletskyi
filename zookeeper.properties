# Конфігурація ZooKeeper (крок 2.3)

# Директорія для даних ZooKeeper (відносно папки kafka)
dataDir=../data/zookeeper
# Порт для клієнтів
clientPort=2181
# 0 = без обмеження кількості підключень з однієї IP-адреси
maxClientCnxns=0
# Вимкнути вбудований HTTP admin-сервер (порт 8080)
admin.enableServer=false

# Тривалість "тіку" (мс) та ліміти ініціалізації/синхронізації (у тіках)
tickTime=2000
initLimit=10
syncLimit=5
